<script>
document.addEventListener('DOMContentLoaded', () => {
  const publications = document.querySelector('.publications-page');
  if (publications) {
    const nav = document.createElement('nav');
    nav.className = 'publication-index';
    nav.setAttribute('data-wdc-attr-zh-aria-label', '论文分类');
    nav.setAttribute('data-wdc-attr-en-aria-label', 'Publication categories');
    nav.setAttribute('aria-label', document.documentElement.lang === 'en' ? 'Publication categories' : '论文分类');
    publications.querySelectorAll('h2').forEach((heading, i) => {
      heading.id = 'publication-section-' + i;
      const link = document.createElement('a');
      link.href = '#' + heading.id;
      for (const node of heading.childNodes) link.append(node.cloneNode(true));
      nav.append(link);
    });
    publications.before(nav);
    publications.querySelectorAll('li').forEach(item => {
      const year = item.textContent.match(/\b(?:19|20)\d{2}\b/);
      if (year) item.dataset.year = year[0];
    });
  }
});
</script>
