<script>
document.addEventListener('DOMContentLoaded', () => {
  const brand = document.querySelector('.navbar-brand');
  if (brand) {
    const english = brand.textContent.trim();
    brand.replaceChildren();
    const title = document.createElement('span');
    title.className = 'brand-chinese';
    title.textContent = '野生动物疫病与保护研究组';
    const sub = document.createElement('span');
    sub.className = 'brand-english';
    sub.textContent = english;
    brand.append(title, sub);
  }
  document.querySelectorAll('.faculty-profile').forEach(profile => {
    const heading = profile.querySelector('.faculty-copy h2');
    const photo = profile.querySelector('.faculty-photo');
    const social = profile.querySelector('.faculty-social-links');
    if (!heading || !photo) return;
    const header = document.createElement('div');
    header.className = 'faculty-heading';
    const identity = document.createElement('div');
    identity.append(heading);
    if (social) identity.append(social);
    header.append(photo, identity);
    profile.prepend(header);
  });
  const contact = document.querySelector('.contact-page-shell p');
  if (contact) {
    for (const node of [...contact.childNodes]) {
      if (node.nodeType === Node.TEXT_NODE && node.textContent.includes('[zyx.huang AT outlook.com]')) {
        const email = document.createElement('span');
        email.className = 'contact-email';
        email.textContent = node.textContent;
        node.replaceWith(email);
      }
    }
  }
  const publications = document.querySelector('.publications-page');
  if (publications) {
    const nav = document.createElement('nav');
    nav.className = 'publication-index';
    nav.setAttribute('aria-label', '论文分类');
    publications.querySelectorAll('h2').forEach((heading, i) => {
      heading.id = 'publication-section-' + i;
      const link = document.createElement('a');
      link.href = '#' + heading.id;
      link.textContent = heading.textContent;
      nav.append(link);
    });
    publications.before(nav);
    publications.querySelectorAll('li').forEach(item => {
      const year = item.textContent.match(/\b(?:19|20)\d{2}\b/);
      if (year) item.dataset.year = year[0];
    });
  }
});
</script>
